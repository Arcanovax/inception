services:
  mariadb:
    build: ./requirements/mariadb
    container_name : mariadb
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - inception


  wordpress:
    build: ./requirements/wordpress
    container_name : wordpress
    restart: always
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_PASSWORD=${WP_USER_PASSWORD}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  adminer:
    build: ./requirements/adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8000:8000"
    networks:
      - inception

  website:
    build: ./requirements/website
    container_name: website
    restart: always
    ports:
      - "7000:7000"
    networks:
      - inception

  redis:
    build: ./requirements/redis
    container_name: redis
    restart: always
    ports:
      - "9000:9000"
    networks:
      - inception


networks:
  inception:
    driver: bridge


volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mthetcha/data/mariadb

  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mthetcha/data/wordpress
