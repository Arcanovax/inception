
services:
  mariadb:
    image: mariadb:1.0
    build: ./requirements/mariadb
    container_name : mariadb
    pull_policy: build
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - inception


  wordpress:
    image: wordpress:1.0
    build: ./requirements/wordpress
    container_name : wordpress
    pull_policy: build
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
      - redis
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_PASSWORD=${WP_USER_PASSWORD}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    networks:
      - inception

  nginx:
    image: nginx:1.0
    build: ./requirements/nginx
    container_name: nginx
    pull_policy: build
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  ftpserver:
    image: ftpserver:1.0
    build: ./requirements/ftpserver
    container_name: ftpserver
    pull_policy: build
    restart: always
    depends_on:
      - wordpress
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASSWORD=${FTP_PASSWORD}
    ports:
      - "21:21"
      - "30000-30005:30000-30005"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  adminer:
    image: adminer:1.0
    build: ./requirements/adminer
    container_name: adminer
    pull_policy: build
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception

  website:
    image: website:1.0
    build: ./requirements/website
    container_name: website
    pull_policy: build
    restart: always
    networks:
      - inception

  lazydocker:
    image: lazydocker:1.0
    build: ./requirements/lazydocker
    container_name: lazydocker
    pull_policy: build
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inception

  redis:
    image: redis:1.0
    build: ./requirements/redis
    container_name: redis
    pull_policy: build
    restart: always
    networks:
      - inception


networks:
  inception:
    driver: bridge


volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mthetcha/data/mariadb

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mthetcha/data/wordpress
